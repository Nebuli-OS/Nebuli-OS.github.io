<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebuli AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root {
    --bg: #0e0114;
    --panel: rgba(255,255,255,0.03);
    --glass: rgba(255,255,255,0.04);
    --gold: #d4af37;
    --gold-dim: rgba(212,175,55,0.18);
    --violet: #8A2BE2;
    --text: #f5e8ff;
    --muted: rgba(245,232,255,0.55);
    --danger: #ff5555;
    --shadow: 0 8px 30px rgba(0,0,0,0.6);
    --modal-bg: #160a22;
}

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    -webkit-font-smoothing: antialiased;
}

body {
    padding: 0;
    display: flex;
    background: radial-gradient(1200px 800px at 10% 10%, rgba(138,43,226,0.06), transparent),
                radial-gradient(1000px 600px at 90% 80%, rgba(212,175,55,0.02), transparent),
                var(--bg);
    color: var(--text);
    overflow: hidden;
}

.btn-icon-wrapper {
    display: inline-block;
    background: var(--gold);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
}

.btn {
    background: rgba(255,255,255,0.05);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 8px;
    font-weight: 600;
    transition: all .15s ease;
    display: inline-flex;
    gap: 8px;
    align-items: center;
}

.btn:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.08);
    border-color: var(--gold);
}

#sidebar {
    width: 250px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid rgba(255,255,255,0.05);
    box-shadow: var(--shadow);
    overflow: hidden;
    flex-shrink: 0;
    transition: width .2s ease, padding .2s ease, opacity .15s ease;
}

#sidebar-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 15px;
    flex-shrink: 0;
}

#new-chat-button {
    flex: 1;
    font-size: 15px;
    justify-content: center;
    white-space: nowrap;
}

#sidebar-collapse-btn, #sidebar-expand-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    flex-shrink: 0;
    justify-content: center;
}

#sidebar-expand-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 500;
    display: none;
    background: var(--panel);
}

body.sidebar-collapsed #sidebar {
    width: 0;
    padding: 0;
    border-right: none;
    opacity: 0;
}

body.sidebar-collapsed #sidebar-expand-btn {
    display: flex;
}

body.sidebar-collapsed #input-area {
    left: 0;
}

#chat-list {
    list-style: none;
    padding: 0;
    margin: 0;
    flex: 1;
    overflow-y: auto;
}

#chat-list::-webkit-scrollbar {
    width: 8px;
}

#chat-list::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(212,175,55,0.22), rgba(138,43,226,0.12));
    border-radius: 8px;
}

.chat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 2px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.02);
    transition: background .12s;
}

.chat-item:hover {
    background: rgba(255,255,255,0.05);
}

.chat-item.active {
    background: var(--gold-dim);
    border-left: 3px solid var(--gold);
}

.chat-item-title {
    flex-grow: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
}

.chat-controls {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.chat-controls button {
    background: none;
    border: none;
    cursor: pointer;
    margin-left: 4px;
    padding: 5px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
}

.chat-controls button .btn-icon-wrapper {
    background: var(--muted);
    transition: background .15s;
}

.chat-controls button:hover {
    background: rgba(255,255,255,0.08);
}

.chat-controls button.rename-btn:hover .btn-icon-wrapper {
    background: var(--gold);
}

.chat-controls button.delete-btn:hover .btn-icon-wrapper {
    background: var(--danger);
}

#usage-widget {
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
}

#usage-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

#usage-icon {
    background: var(--muted);
    flex-shrink: 0;
}

#usage-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
}

#usage-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted);
    background: transparent;
}

#usage-badge.pro {
    border-color: var(--gold);
    color: var(--gold);
}

#usage-bar-track {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(0,0,0,0.4);
    overflow: hidden;
    margin-bottom: 10px;
}

#usage-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--violet), var(--gold));
    transition: width .3s ease;
}

#usage-stats-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
}

#usage-count {
    color: var(--text);
    font-weight: 600;
}

#usage-reset {
    font-size: 11px;
    color: var(--muted);
}

#main-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 20px;
    gap: 20px;
    padding-bottom: 110px;
    overflow-y: auto;
}

#main-content::-webkit-scrollbar {
    width: 8px;
}

#main-content::-webkit-scrollbar-track {
    background: transparent;
}

#main-content::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(212,175,55,0.22), rgba(138,43,226,0.12));
    border-radius: 8px;
}

#chat-container {
    width: 100%;
    max-width: 824px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 0;
}

.user-message, .ai-message {
    margin-bottom: 10px;
    padding: 10px 16px;
    border-radius: 12px;
    max-width: 70%;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
}

.user-message {
    background: rgba(138,43,226,0.12);
    border: 1px solid rgba(138,43,226,0.4);
    margin-left: auto;
    text-align: right;
    color: var(--text);
    box-shadow: var(--shadow);
}

.user-message img {
    max-width: 300px;
    margin-top: 8px;
    border-radius: 8px;
}

.ai-message {
    background: var(--gold-dim);
    border: 1px solid rgba(212,175,55,0.4);
    margin-right: auto;
    text-align: left;
    color: var(--text);
    box-shadow: var(--shadow);
    white-space: pre-wrap;
    max-width: 85%;
}

.ai-message code, .ai-message-generating code {
    background: rgba(0,0,0,0.35);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Consolas', 'JetBrains Mono', monospace;
}

.ai-message pre, .ai-message-generating pre {
    background: rgba(0,0,0,0.35);
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    position: relative;
}

.code-copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(20,8,32,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
    font-family: inherit;
}

.code-copy-btn:hover {
    color: var(--gold);
    border-color: var(--gold);
}

.ai-message-generating {
    background: var(--gold-dim);
    border: 1px solid rgba(212,175,55,0.4);
    margin-right: auto;
    text-align: left;
    color: var(--text);
    box-shadow: var(--shadow);
    max-width: 85%;
    padding: 10px 16px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.nebuli-spinner {
    width: 24px;
    height: 24px;
    animation: spin 2s linear infinite;
    flex-shrink: 0;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

.katex {
    font-size: 1.1em;
}

#input-area {
    position: fixed;
    bottom: 20px;
    left: 250px;
    right: 0;
    padding: 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    transition: left .2s ease;
    z-index: 50;
}

.icon-button {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--modal-bg);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .15s ease;
    flex-shrink: 0;
    padding: 0;
    box-shadow: var(--shadow);
}

.icon-button:hover {
    filter: brightness(1.15);
    border-color: var(--gold);
    transform: translateY(-1px);
}

.icon-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.icon-button:disabled:hover {
    filter: none;
    border-color: rgba(255,255,255,0.08);
    transform: none;
}

#tools-button-wrapper {
    position: relative;
    flex-shrink: 0;
}

#tools-button:hover .btn-icon-wrapper {
    animation: spin .6s linear;
}

#tools-popup {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 0;
    background: var(--modal-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px;
    display: none;
    z-index: 1000;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    min-width: 200px;
}

#tools-popup.active {
    display: block;
}

#tools-popup button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 2px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    transition: background .12s, color .12s;
    font-family: inherit;
    font-size: 14px;
    text-align: left;
}

#tools-popup button:hover {
    background: var(--gold);
    color: #000;
}

#tools-popup button:last-child {
    margin-bottom: 0;
}

#input-wrapper {
    flex: 1;
    max-width: 700px;
    position: relative;
    background: var(--modal-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    box-shadow: var(--shadow);
    transition: border-color .15s ease;
}

#input-wrapper:focus-within {
    border-color: var(--gold);
}

#prompt {
    width: 100%;
    display: block;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    padding: 15px 58px 15px 22px;
    overflow-y: hidden;
}

#prompt::placeholder {
    color: var(--muted);
}

#send-button {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--gold);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s ease;
}

#send-button .btn-icon-wrapper {
    background: #1a0a2a;
}

#send-button:hover {
    transform: translateY(-50%) scale(1.06);
}

#send-button:disabled {
    opacity: 0.5;
    cursor: default;
    transform: translateY(-50%);
}

#scroll-bottom-wrapper {
    position: fixed;
    bottom: 92px;
    left: 250px;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    transition: left .2s ease;
    z-index: 60;
}

body.sidebar-collapsed #scroll-bottom-wrapper {
    left: 0;
}

#scroll-bottom-btn {
    pointer-events: auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--modal-bg);
    border: 1px solid rgba(255,255,255,0.08);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all .15s ease;
}

#scroll-bottom-btn.visible {
    display: flex;
}

#scroll-bottom-btn:hover {
    border-color: var(--gold);
}

#welcome-text {
    text-align: center;
    width: 100%;
    margin-top: 40px;
}

#welcome-text h1 {
    font-size: 36px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 0.5px;
}

.hidden { display: none; }

</style>
</head>
<body>
<button id="sidebar-expand-btn" class="btn" title="Expand sidebar">
    <span class="btn-icon-wrapper" style="-webkit-mask-image:url('/assets/img/sidebar_out.svg'); mask-image:url('/assets/img/sidebar_out.svg'); width:18px; height:18px;"></span>
</button>
<div id="sidebar">
    <div id="sidebar-header">
        <button id="new-chat-button" class="btn">New Chat</button>
        <button id="sidebar-collapse-btn" class="btn" title="Collapse sidebar">
            <span class="btn-icon-wrapper" style="-webkit-mask-image:url('/assets/img/sidebar_in.svg'); mask-image:url('/assets/img/sidebar_in.svg'); width:18px; height:18px;"></span>
        </button>
    </div>
    <ul id="chat-list"></ul>
    <div id="usage-widget">
        <div id="usage-header">
            <span class="btn-icon-wrapper" id="usage-icon" style="-webkit-mask-image:url('/assets/img/usage.svg'); mask-image:url('/assets/img/usage.svg'); width:16px; height:16px;"></span>
            <span id="usage-title">Usage</span>
            <span id="usage-badge">FREE</span>
        </div>
        <div id="usage-bar-track">
            <div id="usage-bar-fill"></div>
        </div>
        <div id="usage-stats-row">
            <span id="usage-count">0/50</span>
            <span id="usage-left">50 left</span>
        </div>
        <div id="usage-reset">Resets 12:00 AM</div>
    </div>
</div>
<div id="main-content">
    <div id="chat-container">
        <div id="welcome-text">
            <h1>Nebuli AI</h1>
        </div>
    </div>
</div>
<div id="scroll-bottom-wrapper">
    <button id="scroll-bottom-btn" title="Scroll to bottom">
        <span class="btn-icon-wrapper" style="-webkit-mask-image:url('/assets/img/down.svg'); mask-image:url('/assets/img/down.svg'); width:18px; height:18px;"></span>
    </button>
</div>
<div id="input-area">
    <div id="tools-button-wrapper">
        <button id="tools-button" class="icon-button" title="More">
            <span class="btn-icon-wrapper" style="-webkit-mask-image:url('/assets/img/more.svg'); mask-image:url('/assets/img/more.svg'); width:22px; height:22px;"></span>
        </button>
        <div id="tools-popup">
            <button id="share-screen-option">Share Screen</button>
            <button id="upload-image-option">Upload Image</button>
        </div>
    </div>
    <div id="input-wrapper">
        <textarea id="prompt" rows="1" placeholder="Type your message..."></textarea>
        <button id="send-button" title="Send">
            <span class="btn-icon-wrapper" style="-webkit-mask-image:url('/assets/img/forward_arrow.svg'); mask-image:url('/assets/img/forward_arrow.svg'); width:16px; height:16px;"></span>
        </button>
    </div>
    <button id="pro-status-button" class="icon-button" title="Pro" disabled>
        <span class="btn-icon-wrapper" id="pro-status-icon" style="-webkit-mask-image:url('/assets/img/no-pro.svg'); mask-image:url('/assets/img/no-pro.svg'); width:22px; height:22px;"></span>
    </button>
</div>
<input type="file" id="image-input" accept="image/*" style="display: none;">

<script>
const chatContainer = document.getElementById("chat-container");
const promptInput = document.getElementById("prompt");
const sendButton = document.getElementById("send-button");
const toolsButton = document.getElementById("tools-button");
const toolsPopup = document.getElementById("tools-popup");
const shareScreenOption = document.getElementById("share-screen-option");
const uploadImageOption = document.getElementById("upload-image-option");
const imageInput = document.getElementById("image-input");
const welcomeText = document.getElementById("welcome-text");
const chatList = document.getElementById("chat-list");
const newChatButton = document.getElementById("new-chat-button");
const sidebarCollapseBtn = document.getElementById("sidebar-collapse-btn");
const sidebarExpandBtn = document.getElementById("sidebar-expand-btn");
const usageCountEl = document.getElementById("usage-count");
const usageLeftEl = document.getElementById("usage-left");
const usageFillEl = document.getElementById("usage-bar-fill");
const usageResetEl = document.getElementById("usage-reset");
const usageBadgeEl = document.getElementById("usage-badge");
const proStatusIcon = document.getElementById("pro-status-icon");
const mainContent = document.getElementById("main-content");
const scrollBottomBtn = document.getElementById("scroll-bottom-btn");

const LOCAL_STORAGE_KEY = 'nebuli_chats';
const SIDEBAR_STATE_KEY = 'nebuli_sidebar_collapsed';
const USAGE_KEY = 'nbli_usage';
const USAGE_SALT = 'nbli_usage_integrity_v1';
const FREE_LIMIT = 50;
const PRO_LIMIT = 100;
const RESET_INTERVAL = 48 * 60 * 60 * 1000;

let chats = {};
let activeChatId = null;
let isScreenSharing = false;
let screenStream = null;
let generatingMessageDiv = null;
let pendingImageData = null;
let isPro = false;
let proUser = null;
let usage = null;

const proDatabase = {
    "e74aee44047586331774643c0dbe094c95c368cf86c7c8156548e47f90f35ea7": "qr7x",
    "d0ba796d91a49164d7f978328fda75baa61323fa9e0f814f5407f9046d2ac011": "technonyte"
};

async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyLicenseKey(rawKey) {
    const computedHash = await sha256(rawKey.trim());
    const matchedUser = proDatabase[computedHash];

    if (matchedUser) {
        localStorage.setItem('nbli-pro', rawKey.trim());
        return { success: true, user: matchedUser };
    }
    return { success: false, user: null };
}

async function checkExistingProSession() {
    const storedKey = localStorage.getItem('nbli-pro');
    if (!storedKey) return { isPro: false, user: null };
    const checkHash = await sha256(storedKey.trim());
    const matchedUser = proDatabase[checkHash];
    if (matchedUser) {
        return { isPro: true, user: matchedUser };
    } else {
        localStorage.removeItem('nbli-pro');
        return { isPro: false, user: null };
    }
}

marked.setOptions({
    breaks: true,
    gfm: true
});

function renderMathInElement(element, options) {
    const delimiters = options.delimiters || [];
    let html = element.innerHTML;
    
    delimiters.forEach(delim => {
        const leftEscaped = delim.left.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const rightEscaped = delim.right.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(leftEscaped + '([\\s\\S]*?)' + rightEscaped, 'g');
        
        html = html.replace(regex, (match, formula) => {
            try {
                const rendered = katex.renderToString(formula, { 
                    throwOnError: false, 
                    displayMode: delim.display 
                });
                return rendered;
            } catch (e) {
                console.error('KaTeX error:', e);
                return match;
            }
        });
    });
    
    element.innerHTML = html;
}

function addCopyButtons(container) {
    container.querySelectorAll('pre').forEach(pre => {
        if (pre.dataset.copyAdded) return;
        pre.dataset.copyAdded = "1";
        const btn = document.createElement('button');
        btn.className = 'code-copy-btn';
        btn.type = 'button';
        btn.textContent = 'Copy';
        btn.addEventListener('click', () => {
            const codeEl = pre.querySelector('code');
            const codeText = codeEl ? codeEl.innerText : pre.innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = 'Copy';
                }, 1500);
            });
        });
        pre.appendChild(btn);
    });
}

function autoResizeTextarea() {
    promptInput.style.height = 'auto';
    promptInput.style.height = promptInput.scrollHeight + 'px';
}

function isNearBottom() {
    return mainContent.scrollHeight - mainContent.scrollTop - mainContent.clientHeight < 80;
}

function updateScrollButton() {
    scrollBottomBtn.classList.toggle('visible', !isNearBottom());
}

function setSidebarCollapsed(collapsed) {
    document.body.classList.toggle('sidebar-collapsed', collapsed);
    localStorage.setItem(SIDEBAR_STATE_KEY, collapsed ? '1' : '0');
}

function loadSidebarState() {
    if (localStorage.getItem(SIDEBAR_STATE_KEY) === '1') {
        setSidebarCollapsed(true);
    }
}

function getMidnight(ts) {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
}

async function computeUsageSig(count, resetAt) {
    return await sha256(`${USAGE_SALT}:${count}:${resetAt}`);
}

async function loadUsage() {
    const now = Date.now();
    let raw = null;
    try {
        raw = JSON.parse(localStorage.getItem(USAGE_KEY) || 'null');
    } catch (e) {
        raw = null;
    }

    let stored = null;

    if (raw && typeof raw.count === 'number' && typeof raw.resetAt === 'number') {
        const expectedSig = await computeUsageSig(raw.count, raw.resetAt);
        if (raw.sig === expectedSig) {
            stored = { count: raw.count, resetAt: raw.resetAt };
        } else {
            stored = { count: FREE_LIMIT, resetAt: now + RESET_INTERVAL };
        }
    }

    if (!stored) {
        const anchor = getMidnight(now);
        stored = { count: 0, resetAt: anchor + RESET_INTERVAL };
    } else if (now >= stored.resetAt) {
        let nextReset = stored.resetAt;
        while (now >= nextReset) {
            nextReset += RESET_INTERVAL;
        }
        stored = { count: 0, resetAt: nextReset };
    }

    const sig = await computeUsageSig(stored.count, stored.resetAt);
    localStorage.setItem(USAGE_KEY, JSON.stringify({ count: stored.count, resetAt: stored.resetAt, sig }));
    return stored;
}

async function saveUsage() {
    const sig = await computeUsageSig(usage.count, usage.resetAt);
    localStorage.setItem(USAGE_KEY, JSON.stringify({ count: usage.count, resetAt: usage.resetAt, sig }));
}

function getLimit() {
    return isPro ? PRO_LIMIT : FREE_LIMIT;
}

async function incrementUsage() {
    usage.count++;
    await saveUsage();
    renderUsage();
}

function formatResetTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function renderUsage() {
    const limit = getLimit();
    const left = Math.max(0, limit - usage.count);
    const pct = Math.min(100, (usage.count / limit) * 100);
    usageCountEl.textContent = `${usage.count}/${limit}`;
    usageLeftEl.textContent = `${left} left`;
    usageFillEl.style.width = (usage.count > 0 ? Math.max(pct, 3) : 0) + '%';
    usageResetEl.textContent = `Resets ${formatResetTime(usage.resetAt)}`;
    usageBadgeEl.textContent = isPro ? 'PRO' : 'FREE';
    usageBadgeEl.classList.toggle('pro', isPro);
}

async function refreshProStatus() {
    const result = await checkExistingProSession();
    isPro = result.isPro;
    proUser = result.user;
    const icon = isPro ? '/assets/img/pro.svg' : '/assets/img/no-pro.svg';
    proStatusIcon.style.webkitMaskImage = `url('${icon}')`;
    proStatusIcon.style.maskImage = `url('${icon}')`;
    renderUsage();
}

function showLimitNotice() {
    const currentWelcome = chatContainer.querySelector('#welcome-text');
    if (currentWelcome) currentWelcome.classList.add("hidden");
    const div = document.createElement("div");
    div.classList.add("ai-message");
    div.textContent = `You've reached your limit of ${getLimit()} messages every 48 hours. Resets ${formatResetTime(usage.resetAt)}.`;
    chatContainer.appendChild(div);
}

function loadChats() {
    const storedChats = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (storedChats) {
        chats = JSON.parse(storedChats);
    } else {
        createNewChat('New Chat 1', false);
    }
    activeChatId = activeChatId || Object.keys(chats)[0];
    renderChatList();
    loadActiveChat();
}

function saveChats() {
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(chats));
}

function createNewChat(title = 'New Chat', setActive = true) {
    const newId = Date.now().toString();
    chats[newId] = { title: title, messages: [] };
    if (setActive) {
        activeChatId = newId;
        saveChats();
        renderChatList();
        loadActiveChat();
    }
    return newId;
}

function setActiveChat(chatId) {
    if (activeChatId === chatId) return;
    activeChatId = chatId;
    loadActiveChat();
    renderChatList();
}

function renameChat(chatId, newTitle) {
    if (chats[chatId]) {
        chats[chatId].title = newTitle;
        saveChats();
        renderChatList();
    }
}

function deleteChat(chatId) {
    if (confirm(`Are you sure you want to delete "${chats[chatId].title}"?`)) {
        delete chats[chatId];
        if (activeChatId === chatId) {
            const chatKeys = Object.keys(chats);
            activeChatId = chatKeys.length > 0 ? chatKeys[0] : createNewChat('New Chat', false);
        }
        saveChats();
        renderChatList();
        loadActiveChat();
    }
}

function renderChatList() {
    chatList.innerHTML = '';
    for (const id in chats) {
        const chat = chats[id];
        const li = document.createElement('li');
        li.className = 'chat-item' + (id === activeChatId ? ' active' : '');
        li.dataset.chatId = id;

        const titleSpan = document.createElement('span');
        titleSpan.className = 'chat-item-title';
        titleSpan.textContent = chat.title;
        titleSpan.addEventListener('click', () => setActiveChat(id));
        li.appendChild(titleSpan);

        const controlsDiv = document.createElement('div');
        controlsDiv.className = 'chat-controls';

        const renameBtn = document.createElement('button');
        renameBtn.className = 'rename-btn';
        renameBtn.title = 'Rename Chat';
        renameBtn.innerHTML = '<span class="btn-icon-wrapper" style="-webkit-mask-image:url(\'/assets/img/edit.svg\'); mask-image:url(\'/assets/img/edit.svg\'); width:14px; height:14px;"></span>';
        renameBtn.addEventListener('click', () => {
            const newTitle = prompt('Enter new chat title:', chat.title);
            if (newTitle && newTitle.trim()) renameChat(id, newTitle.trim());
        });
        controlsDiv.appendChild(renameBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.title = 'Delete Chat';
        deleteBtn.innerHTML = '<span class="btn-icon-wrapper" style="-webkit-mask-image:url(\'/assets/img/close.svg\'); mask-image:url(\'/assets/img/close.svg\'); width:14px; height:14px;"></span>';
        deleteBtn.addEventListener('click', () => deleteChat(id));
        controlsDiv.appendChild(deleteBtn);

        li.appendChild(controlsDiv);
        chatList.appendChild(li);
    }
}

function loadActiveChat() {
    chatContainer.innerHTML = '';
    const activeChat = chats[activeChatId];
    if (!activeChat || activeChat.messages.length === 0) {
        welcomeText.classList.remove("hidden");
        chatContainer.appendChild(welcomeText.cloneNode(true));
        return;
    }
    welcomeText.classList.add("hidden");
    activeChat.messages.forEach(msg => {
        if (msg.role === 'user') addUserMessage(msg.content, false);
        else if (msg.role === 'ai') addAiMessage(msg.content, false);
    });
}

function addUserMessage(message, saveAndScroll = true) {
    const div = document.createElement("div");
    div.classList.add("user-message");
    div.textContent = message;
    
    chatContainer.appendChild(div);
    if (saveAndScroll) {
        chats[activeChatId].messages.push({ role: 'user', content: message });
        saveChats();
    }
}

function addUserMessageWithImage(message, imageData) {
    const div = document.createElement("div");
    div.classList.add("user-message");
    div.textContent = message;
    
    if (imageData) {
        const img = document.createElement("img");
        img.src = imageData;
        div.appendChild(img);
    }
    
    chatContainer.appendChild(div);
    chats[activeChatId].messages.push({ role: 'user', content: message });
    saveChats();
}

function createGeneratingMessage() {
    const div = document.createElement("div");
    div.classList.add("ai-message-generating");
    
    const img = document.createElement("img");
    img.src = "https://assets.nebulilabs.xyz/nebuli.png";
    img.classList.add("nebuli-spinner");
    
    const textSpan = document.createElement("span");
    textSpan.textContent = "Generating...";
    
    div.appendChild(img);
    div.appendChild(textSpan);
    chatContainer.appendChild(div);
    
    generatingMessageDiv = div;
    return div;
}

function updateGeneratingMessage(text) {
    if (generatingMessageDiv) {
        const textSpan = generatingMessageDiv.querySelector("span");
        if (textSpan) {
            textSpan.innerHTML = marked.parse(text);
            hljs.highlightAll();
            renderMathInElement(textSpan, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ],
                throwOnError: false
            });
            addCopyButtons(textSpan);
        }
    }
}

function replaceGeneratingMessage(fullMessage) {
    if (generatingMessageDiv) {
        generatingMessageDiv.remove();
        generatingMessageDiv = null;
    }
    
    const div = document.createElement("div");
    div.classList.add("ai-message");
    
    const html = marked.parse(fullMessage);
    div.innerHTML = html;
    
    chatContainer.appendChild(div);
    
    hljs.highlightAll();
    
    renderMathInElement(div, {
        delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false
    });
    
    addCopyButtons(div);
    
    return div;
}

function addAiMessage(message, saveAndScroll = true) {
    const div = document.createElement("div");
    div.classList.add("ai-message");
    
    const html = marked.parse(message);
    div.innerHTML = html;
    
    chatContainer.appendChild(div);
    
    hljs.highlightAll();
    
    renderMathInElement(div, {
        delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false
    });
    
    addCopyButtons(div);
    
    if (saveAndScroll) {
        chats[activeChatId].messages.push({ role: 'ai', content: message });
        saveChats();

        const messages = chats[activeChatId].messages;
        if (messages.length === 2 && messages[0].role === 'user') {
            const firstUserMessage = messages[0].content;
            let newTitle = firstUserMessage.length > 30 ? firstUserMessage.substring(0, 30) + '...' : firstUserMessage;
            renameChat(activeChatId, newTitle);
        }
    }
}

async function captureScreenFrame() {
    if (!screenStream) return null;
    
    const video = document.createElement('video');
    video.srcObject = screenStream;
    video.play();
    
    await new Promise(resolve => {
        video.onloadedmetadata = resolve;
    });
    
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    
    return canvas.toDataURL('image/png', 0.05);
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            resolve(reader.result);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function stopSharing() {
    if (screenStream) {
        screenStream.getTracks().forEach(track => {
            track.stop();
        });
        screenStream = null;
        isScreenSharing = false;
        shareScreenOption.textContent = 'Share Screen';
        shareScreenOption.style.background = 'transparent';
        shareScreenOption.style.color = 'var(--text)';
    }
}

async function startSharing() {
    try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: 'always' },
            audio: false
        });

        screenStream = stream;
        isScreenSharing = true;
        shareScreenOption.textContent = 'Stop Sharing';
        shareScreenOption.style.background = 'var(--gold-dim)';
        shareScreenOption.style.color = 'var(--gold)';

        stream.getTracks().forEach(track => {
            track.onended = () => {
                stopSharing();
            };
        });

    } catch (err) {
        if (err.name !== 'NotAllowedError') {
            console.error('Error sharing screen:', err);
            alert('Failed to share screen. Please try again.');
        }
    }
}

function toggleScreenShare() {
    if (isScreenSharing) {
        stopSharing();
    } else {
        startSharing();
    }
}

function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    fileToBase64(file).then(imageData => {
        pendingImageData = imageData;
        toolsPopup.classList.remove('active');
    }).catch(err => {
        console.error('Error reading file:', err);
        alert('Failed to read image file.');
    });
}

function buildConversationHistory() {
    const activeChat = chats[activeChatId];
    const messages = [];
    
    for (const msg of activeChat.messages) {
        messages.push({
            role: msg.role,
            content: msg.content
        });
    }
    
    return messages;
}

async function sendMessage() {
    const prompt = promptInput.value.trim();
    if (!prompt || !activeChatId) return;

    if (usage.count >= getLimit()) {
        showLimitNotice();
        return;
    }

    const currentWelcome = chatContainer.querySelector('#welcome-text');
    if (currentWelcome) currentWelcome.classList.add("hidden");

    let imageData = null;
    if (isScreenSharing) {
        imageData = await captureScreenFrame();
        addUserMessageWithImage(prompt, imageData);
    } else if (pendingImageData) {
        imageData = pendingImageData;
        addUserMessageWithImage(prompt, imageData);
        pendingImageData = null;
    } else {
        addUserMessage(prompt, true);
    }

    await incrementUsage();

    promptInput.value = "";
    autoResizeTextarea();
    sendButton.disabled = true;

    createGeneratingMessage();

    try {
        const conversationHistory = buildConversationHistory();

        const requestBody = {
            prompt: prompt,
            messages: conversationHistory
        };
        
        if (imageData) {
            requestBody.image = imageData;
        }

        console.log('%cRequest Body:', 'color: #8A2BE2; font-weight: bold; font-size: 14px;', requestBody);

        const response = await fetch('http://localhost:6569/api/groq', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
            const text = await response.text();
            throw new Error(`Backend error ${response.status}: ${text}`);
        }

        const data = await response.json();
        if (!data.response) throw new Error("No response field returned from backend");

        const fullMessage = data.response;
        const words = fullMessage.split(' ');
        let currentIndex = 0;
        
        const typeInterval = setInterval(() => {
            if (currentIndex < words.length) {
                currentIndex += Math.floor(Math.random() * 3) + 1;
                if (currentIndex > words.length) currentIndex = words.length;
                const displayText = words.slice(0, currentIndex).join(' ');
                updateGeneratingMessage(displayText);
            } else {
                clearInterval(typeInterval);
                replaceGeneratingMessage(fullMessage);
                chats[activeChatId].messages.push({ role: 'ai', content: fullMessage });
                saveChats();

                const messages = chats[activeChatId].messages;
                if (messages.length === 2 && messages[0].role === 'user') {
                    const firstUserMessage = messages[0].content;
                    let newTitle = firstUserMessage.length > 30 ? firstUserMessage.substring(0, 30) + '...' : firstUserMessage;
                    renameChat(activeChatId, newTitle);
                }
            }
        }, 30);

    } catch (err) {
        console.error("SendMessage Error:", err);
        replaceGeneratingMessage(`Error contacting AI backend:\n${err.message}`);
    } finally {
        sendButton.disabled = false;
    }
}

toolsButton.addEventListener('click', (e) => {
    e.stopPropagation();
    toolsPopup.classList.toggle('active');
});

document.addEventListener('click', (e) => {
    if (!toolsButton.contains(e.target) && !toolsPopup.contains(e.target)) {
        toolsPopup.classList.remove('active');
    }
});

shareScreenOption.addEventListener('click', () => {
    toggleScreenShare();
    toolsPopup.classList.remove('active');
});

uploadImageOption.addEventListener('click', () => {
    imageInput.click();
});

imageInput.addEventListener('change', handleImageUpload);

sendButton.addEventListener('click', sendMessage);
newChatButton.addEventListener('click', () => createNewChat());
sidebarCollapseBtn.addEventListener('click', () => setSidebarCollapsed(true));
sidebarExpandBtn.addEventListener('click', () => setSidebarCollapsed(false));
promptInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});
promptInput.addEventListener('input', autoResizeTextarea);
mainContent.addEventListener('scroll', updateScrollButton);
scrollBottomBtn.addEventListener('click', () => {
    mainContent.scrollTo({ top: mainContent.scrollHeight, behavior: 'smooth' });
});
const chatObserver = new MutationObserver(updateScrollButton);
chatObserver.observe(chatContainer, { childList: true, subtree: true });

async function init() {
    loadSidebarState();
    usage = await loadUsage();
    renderUsage();
    await refreshProStatus();
    loadChats();
    updateScrollButton();
    setInterval(async () => {
        if (Date.now() >= usage.resetAt) {
            usage = await loadUsage();
            renderUsage();
        }
    }, 60000);
}

init();
</script>
</body>
