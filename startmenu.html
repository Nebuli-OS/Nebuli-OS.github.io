<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --glass-surface: rgba(12, 12, 12, 0.92); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --inner-glow: rgba(255, 255, 255, 0.03);
            --hover-item: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --accent-gradient: linear-gradient(90deg, #FFD700 0%, #8A2BE2 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, sans-serif;
            background: transparent; 
        }

        .start-container {
            width: 100%; height: 100%;
            background: var(--glass-surface);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .content { 
            padding: 15px 20px;
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            width: 100%;
        }

        .search-box-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .search-box {
            background: rgba(45, 45, 45, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 12px; border-radius: 4px; width: 100%;
            outline: none; color: white; font-size: 0.75rem;
            transition: 0.2s;
        }

        .search-box-container::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 2px;
            background: var(--accent-gradient);
            border-radius: 0 0 4px 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .search-box-container:focus-within::after { opacity: 1; }

        .section-header { margin-bottom: 8px; padding-left: 4px; }
        .section-header span { font-weight: 600; font-size: 0.68rem; color: var(--text-color); opacity: 0.7; }

        .app-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); 
            gap: 4px; 
            margin-bottom: 20px; 
        }
        .app-item { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 8px 4px; border-radius: 4px; transition: 0.1s; 
            cursor: pointer; text-decoration: none;
        }
        .app-item:hover { background: var(--hover-item); }
        .icon-img { width: 24px; height: 24px; object-fit: contain; margin-bottom: 6px; filter: brightness(0) invert(1); }
        .app-name { font-size: 0.62rem; text-align: center; color: var(--text-color); }

        .recent-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .recent-item { 
            display: flex; align-items: center; gap: 8px; padding: 6px 10px; 
            border-radius: 4px; transition: 0.1s; cursor: pointer; text-decoration: none;
        }
        .recent-item:hover { background: var(--hover-item); }
        .recent-icon { width: 16px; height: 16px; object-fit: contain; filter: brightness(0) invert(1); opacity: 0.8; }
        .recent-info { display: flex; flex-direction: column; overflow: hidden; }
        .recent-name { font-size: 0.7rem; font-weight: 400; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .recent-meta { font-size: 0.6rem; color: rgba(255,255,255,0.4); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .footer { 
            background: rgba(0, 0, 0, 0.4); 
            padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-top: 1px solid var(--glass-border); 
        }
        .user-pill { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: white; }
        .avatar { width: 24px; height: 24px; background: white; border-radius: 50%; display:flex; align-items:center; justify-content:center; color: black; font-weight: bold; font-size: 0.6rem; }
        .power-icon { font-size: 1rem; color: white; cursor: pointer; opacity: 0.7; transition: 0.2s;}
        .power-icon:hover { opacity: 1; color: #ff4b4b; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="start-container">
    <div class="content">
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search..." autocomplete="off">
        </div>

        <div id="appsWrapper">
            <div class="section-header"><span>Pinned</span></div>
            <div class="app-grid" id="mainAppGrid">
                <div class="app-item" onclick="sendAction('open_internet')"><img src="/assets/img/internet.svg" class="icon-img"><span class="app-name">Internet</span></div>
                <div class="app-item" onclick="sendAction('open_games')"><img src="/assets/img/game.svg" class="icon-img"><span class="app-name">Games</span></div>
                <div class="app-item" onclick="sendAction('open_tools', 'AI')"><img src="/assets/img/ai.svg" class="icon-img"><span class="app-name">AI</span></div>
                <div class="app-item" onclick="sendAction('open_tools', 'Music')"><img src="/assets/img/music.svg" class="icon-img"><span class="app-name">Music</span></div>
                <div class="app-item" onclick="sendAction('open_tools', 'Editor')"><img src="/assets/img/code.svg" class="icon-img"><span class="app-name">Editor</span></div>
                <div class="app-item" onclick="sendAction('open_tools', 'Chat')"><img src="/assets/img/chat.svg" class="icon-img"><span class="app-name">Chat</span></div>
                <div class="app-item" onclick="sendAction('open_tools', 'Movies')"><img src="/assets/img/streaming.svg" class="icon-img"><span class="app-name">Movies</span></div>
                <div class="app-item" onclick="sendAction('open_files')"><img src="/assets/img/folder.svg" class="icon-img"><span class="app-name">Files</span></div>
                <div class="app-item" onclick="sendAction('open_settings')"><img src="/assets/img/setting.svg" class="icon-img"><span class="app-name">Settings</span></div>
                <div class="app-item" onclick="sendAction('open_more')"><img src="/assets/img/more.svg" class="icon-img"><span class="app-name">More</span></div>
            </div>
        </div>

        <div class="section-header"><span id="listTitle">Recent</span></div>
        <div class="recent-list" id="dynamicList"></div>
    </div>

    <div class="footer">
        <div class="user-pill"><div class="avatar">NG</div><span>Nebuli Guest</span></div>
        <div class="power-icon" onclick="sendAction('close_start')">⏻</div>
    </div>
</div>

<script>
    const GAMES_ICON = "/assets/img/game.svg";
    const FOLDER_ICON = "/assets/img/file.svg";
    const GAME_SOURCES = [
        "Lumin",
        "GN-Math",
        "UGS",
        "Cloudmoon",
        "Truffled",
        "Wasm.rip",
        "CKV",
        "NBLI-Ports"
    ];
    const EXCLUDED_GNMATH_GAMES = new Set([
        "[!] SUGGEST GAMES .gg/D4c9VFYWyU",
        "[!] COMMENTS",
        "Chat Bot AI (A.I GPT)"
    ]);
    const GAME_SOURCE_LOADERS = {
        "GN-Math": () => fetchJson("https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json")
            .then(games => games.filter(game =>
                !EXCLUDED_GNMATH_GAMES.has(game.name || game.title || "")
            ))
            .then(games => games.map(game => ({
                name: game.name || game.title || "",
                url: resolveZoneUrl(game.url)
            }))),
        "UGS": () => fetchJson("/assets/game/ugs.json").then(games => games.map(game => ({
            name: game.name || "",
            url: game.url
        }))),
        "Cloudmoon": loadCloudmoonGames,
        "Truffled": () => fetchJson("/assets/game/truffled.json").then(data =>
            (data.games || []).map(game => {
                const slug = game.name.toLowerCase().trim()
                    .replace(/\s+/g, "-")
                    .replace(/[^\w-]+/g, "")
                    .replace(/--+/g, "-");
                return {
                    name: game.name || "",
                    url: `/assets/game/t/${slug}/${(game.url || "").split("/").pop()}`
                };
            })
        ),
        "Wasm.rip": () => fetchJson("/assets/game/w.json").then(games => games.map(game => ({
            name: game.title || "",
            url: game.href
        }))),
        "CKV": () => fetchJson("/assets/game/c.json").then(games => games.map(game => ({
            name: game.name || "Game",
            url: game.url
        }))),
        "NBLI-Ports": () => fetchJson("/assets/game/n.json").then(games => games.map(game => ({
            name: game.title || "",
            url: game.href
        })))
    };
    const gameSourceCache = new Map();
    let luminGamesPromise;
    let luminScriptPromise;
    let cloudmoonGamesPromise;
    let searchRequestId = 0;

    function sendAction(type, detail = "") {
        window.parent.postMessage({ type: type, detail: detail }, "*");
    }

    async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed (${response.status}): ${url}`);
        return response.json();
    }

    function resolveZoneUrl(url) {
        return (url || "")
            .replaceAll("{COVER_URL}", "https://cdn.jsdelivr.net/gh/freebuisness/covers@main/")
            .replaceAll("{HTML_URL}", "https://cdn.jsdelivr.net/gh/freebuisness/html@main/");
    }

    function getGameSource(source) {
        if (source === "Lumin") return loadLuminGames();
        if (!gameSourceCache.has(source)) {
            const loader = GAME_SOURCE_LOADERS[source];
            if (!loader) return Promise.resolve([]);
            gameSourceCache.set(source, loader().catch(error => {
                console.error(`[${source} Search Load Error]:`, error);
                return [];
            }));
        }
        return gameSourceCache.get(source);
    }

    function loadLuminScript() {
        if (window.Lumin) return Promise.resolve(window.Lumin);
        if (!luminScriptPromise) {
            luminScriptPromise = new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js";
                script.onload = () => window.Lumin
                    ? resolve(window.Lumin)
                    : reject(new Error("Lumin SDK loaded without exposing its API."));
                script.onerror = () => reject(new Error("Failed to load the Lumin SDK."));
                document.head.appendChild(script);
            }).catch(error => {
                luminScriptPromise = null;
                throw error;
            });
        }
        return luminScriptPromise;
    }

    function loadLuminGames() {
        if (!luminGamesPromise) {
            luminGamesPromise = (async () => {
                const lumin = await loadLuminScript();
                await lumin.init({ headless: true });
                const { games } = await lumin.getGames({ page: 1, limit: 99999999 });
                return games.map(game => ({
                    name: game.name || "",
                    url: null
                }));
            })().catch(error => {
                console.error("[Lumin Search Load Error]:", error);
                luminGamesPromise = null;
                return [];
            });
        }
        return luminGamesPromise;
    }

    function generateUUID() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, character => {
            const random = Math.random() * 16 | 0;
            return (character === "x" ? random : (random & 3 | 8)).toString(16);
        });
    }

    async function loadCloudmoonGames() {
        if (!cloudmoonGamesPromise) {
            cloudmoonGamesPromise = (async () => {
                const hosts = [
                    "https://api.cloudmoon.cloudbatata.com",
                    "https://api.prod.cloudmoonapp.com",
                    "https://api.prod.geometry.today",
                    "https://hrz5zfjq02.execute-api.us-east-1.amazonaws.com",
                    "https://api.prod.viewoncloud.com"
                ];
                const host = await new Promise(resolve => {
                    let failures = 0;
                    let settled = false;
                    const controllers = hosts.map(() => new AbortController());
                    hosts.forEach((url, index) => {
                        const controller = controllers[index];
                        const timeout = setTimeout(() => controller.abort(), 3000);
                        fetch(`${url}/_ping`, { signal: controller.signal })
                            .then(response => {
                                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                                if (!settled) {
                                    settled = true;
                                    controllers.forEach((other, otherIndex) => {
                                        if (otherIndex !== index) other.abort();
                                    });
                                    resolve(url);
                                }
                            })
                            .catch(() => {
                                if (++failures === hosts.length && !settled) resolve(null);
                            })
                            .finally(() => clearTimeout(timeout));
                    });
                });
                if (!host) throw new Error("No Cloudmoon API host responded.");

                const deviceId = localStorage.getItem("cm_device_id") || generateUUID();
                localStorage.setItem("cm_device_id", deviceId);
                const token = localStorage.getItem("cm_auth_token");
                const makeRequest = async path => {
                    const url = new URL(`${host}${path}`);
                    url.searchParams.set("device_type", "web");
                    url.searchParams.set("query_uuid", generateUUID());
                    url.searchParams.set("site", "cm");
                    url.searchParams.set("device_id", deviceId);
                    const headers = {
                        "Content-Type": "application/json",
                        "X-User-Language": localStorage.getItem("cm_lang") || navigator.language.split("-")[0] || "en",
                        "X-User-Locale": (navigator.language.split("-")[1] || navigator.language.split("-")[0]).toUpperCase()
                    };
                    if (token) headers["X-User-Token"] = token;
                    const response = await fetch(url, { headers });
                    if (!response.ok) throw new Error(`Cloudmoon request failed (${response.status}): ${path}`);
                    return response.json();
                };

                let userLevel = 0;
                if (token) {
                    try {
                        const phones = await makeRequest("/phone/list");
                        if (phones.code === 0 && phones.data?.list?.length) {
                            userLevel = Math.max(...phones.data.list.map(phone => phone.level || 0));
                        }
                    } catch (error) {
                        console.error("[Cloudmoon User Level Load Error]:", error);
                    }
                }

                const response = await makeRequest(token ? "/game/list" : "/game/guest_list");
                if (response.code !== 0 || !response.data?.list) {
                    throw new Error(response.message || "Cloudmoon returned no game list.");
                }
                return response.data.list
                    .filter(game => game.status === 1 && (!game.is_high || userLevel === 3))
                    .map(game => ({
                        name: game.title || "",
                        url: null
                    }));
            })().catch(error => {
                console.error("[Cloudmoon Search Load Error]:", error);
                cloudmoonGamesPromise = null;
                return [];
            });
        }
        return cloudmoonGamesPromise;
    }

    async function searchGames(query) {
        const sourceGames = await Promise.all(GAME_SOURCES.map(async source => ({
            source,
            games: await getGameSource(source)
        })));
        return sourceGames.flatMap(({ source, games }) =>
            games.filter(game => (game.name || "").toLowerCase().includes(query))
                .map(game => ({ ...game, source }))
        );
    }

    function loadRecent() {
        const container = document.getElementById('dynamicList');
        container.innerHTML = "";
        document.getElementById('listTitle').textContent = "Recent";
        document.getElementById('appsWrapper').style.display = "block";

        const gamesData = JSON.parse(localStorage.getItem('recentGames')) || [];
        gamesData.slice(0, 2).forEach(g => {
            createItem(container, g.name, "Game", GAMES_ICON, () => sendAction('open_specific_game', g.link));
        });

        const filesData = JSON.parse(localStorage.getItem('recentFiles')) || [];
        filesData.slice(0, 2).forEach(path => {
            const fileName = path.split('/').pop();
            createItem(container, fileName, "File", FOLDER_ICON, () => sendAction('open_specific_file', path));
        });
    }

    function searchVFS(obj, query, path = "", results = []) {
        for (let key in obj) {
            let currentPath = path + (path === "" ? "" : "/") + key;
            if (obj[key].type === "file") {
                if (key.toLowerCase().includes(query)) results.push({ name: key, fullPath: currentPath });
            } else if (obj[key].type === "folder" && obj[key].children) {
                searchVFS(obj[key].children, query, currentPath, results);
            }
        }
        return results;
    }

    document.getElementById('searchInput').addEventListener('input', async (e) => {
        const q = e.target.value.trim().toLowerCase();
        const container = document.getElementById('dynamicList');
        const appsWrapper = document.getElementById('appsWrapper');
        const requestId = ++searchRequestId;
        if (q === "") { loadRecent(); return; }
        appsWrapper.style.display = "none";
        document.getElementById('listTitle').textContent = "Results";
        container.innerHTML = "";

        try {
            const matches = await searchGames(q);
            if (requestId !== searchRequestId) return;
            matches.forEach(game => {
                const selection = {
                        source: game.source,
                        name: game.name,
                        url: game.url || null
                };
                const launchUrl = `/games.html?startGame=${encodeURIComponent(JSON.stringify(selection))}`;
                createItem(container, game.name, game.source, GAMES_ICON, () =>
                    sendAction("open_specific_game", launchUrl)
                );
            });
        } catch (error) {
            console.error("[Game Search Error]:", error);
        }

        const vfsRaw = localStorage.getItem("vfs_file_manager_data");
        if (vfsRaw) {
            try {
                searchVFS(JSON.parse(vfsRaw), q).slice(0, 6).forEach(file => {
                    createItem(container, file.name, "File", FOLDER_ICON, () => sendAction('open_specific_file', file.fullPath));
                });
            } catch (error) {
                console.error("[File Search Error]:", error);
            }
        }
    });

    function createItem(parent, title, meta, iconSrc, callback) {
        const item = document.createElement('div');
        item.className = 'recent-item';
        item.onclick = callback;
        const icon = document.createElement("img");
        icon.src = iconSrc;
        icon.className = "recent-icon";
        const info = document.createElement("div");
        info.className = "recent-info";
        const name = document.createElement("span");
        name.className = "recent-name";
        name.textContent = title;
        const details = document.createElement("span");
        details.className = "recent-meta";
        details.textContent = meta;
        info.append(name, details);
        item.append(icon, info);
        parent.appendChild(item);
    }
    loadRecent();
</script>

</body>
</html>
